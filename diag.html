<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>diag</title></head>
<body style="font-family:monospace;font-size:15px;padding:16px">
<h3>chat endpoint diagnostics</h3>
<div id="out">starting…</div>
<script>
var out = document.getElementById('out');
function line(t) { var d = document.createElement('div'); d.textContent = t; out.appendChild(d); }
function testA() {
  var t0 = Date.now();
  line('A: plain fetch POST, no signal — sending…');
  fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'diag A plain', today: '1405-8-24' }) })
    .then(function (r) { return r.text().then(function (t) { line('A DONE ' + (Date.now() - t0) + 'ms status=' + r.status + ' body=' + t.slice(0, 160)); testB(); }); })
    .catch(function (e) { line('A ERROR ' + (Date.now() - t0) + 'ms ' + e.name + ': ' + e.message); testB(); });
}
function testB() {
  var t0 = Date.now();
  line('B: fetch POST with AbortSignal — sending…');
  var ctrl = new AbortController();
  fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'diag B signal', today: '1405-8-24' }), signal: ctrl.signal })
    .then(function (r) { return r.text().then(function (t) { line('B DONE ' + (Date.now() - t0) + 'ms status=' + r.status + ' body=' + t.slice(0, 160)); testD(); }); })
    .catch(function (e) { line('B ERROR ' + (Date.now() - t0) + 'ms ' + e.name + ': ' + e.message); testD(); });
}
function testD() {
  var t0 = Date.now();
  line('D: XMLHttpRequest POST — sending…');
  var x = new XMLHttpRequest();
  x.open('POST', '/api/chat', true);
  x.setRequestHeader('Content-Type', 'application/json');
  x.onload = function () { line('D DONE ' + (Date.now() - t0) + 'ms status=' + x.status + ' body=' + String(x.responseText).slice(0, 160)); line('ALL TESTS FINISHED'); };
  x.onerror = function () { line('D ERROR ' + (Date.now() - t0) + 'ms'); line('ALL TESTS FINISHED'); };
  x.send(JSON.stringify({ message: 'diag D xhr', today: '1405-8-24' }));
}
testA();
</script>
</body></html>

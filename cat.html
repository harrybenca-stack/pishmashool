<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>پیش‌مشول — خونه‌ی گربه</title>
<meta name="theme-color" content="#131f3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root{ --accent:#2563eb; --accent-ink:#ffffff; --ink:#1c2333; --ink-2:#55617a; --surface:#ffffff; --surface-2:#eef1f8; --line:#dde3ef; --dx:0px; --dy:0px; --rot:0deg; }
*{ box-sizing:border-box; }
html{ touch-action:manipulation; overscroll-behavior:none; }
body{ margin:0; font-family:Tahoma,'Segoe UI',sans-serif; color:#eef1f8; min-height:100dvh; display:flex; flex-direction:column; align-items:center;
  background-color:#131f3d; background-image:radial-gradient(120% 90% at 50% 0%, #2a3c68 0%, #1a2748 55%, #101a33 100%);
  touch-action:manipulation; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; overflow-x:hidden; }
header{ text-align:center; padding:26px 16px 2px; }
header h1{ margin:0; font-size:30px; }
header p{ margin:6px 0 0; color:#a5b0c6; font-size:14px; }
.stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; padding:0 16px; }
.wall-frame{ cursor:pointer; position:absolute; top:calc(env(safe-area-inset-top,0px) + 108px); left:16px; width:86px; background:#fff; padding:4px 4px 13px; border:4px solid #B07E2E; border-radius:4px; box-shadow:0 10px 24px rgba(60,35,5,.28); transform:rotate(2deg); z-index:5; }
.wall-frame::before{ content:''; position:absolute; top:-13px; left:50%; margin-left:-3px; width:6px; height:6px; border-radius:50%; background:#D8B25C; box-shadow:0 1px 3px rgba(0,0,0,.5); }
.wall-frame img{ width:100%; display:block; border-radius:2px; }
.wall-frame::after{ content:'❤'; position:absolute; bottom:0; left:0; right:0; text-align:center; font-size:9px; color:#D96A8B; }
/* ---------- پیش‌مشول زنده ---------- */
      .pm { position: fixed; left: 10px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 80; direction: ltr; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; pointer-events: none; }
.pm.in { transition: opacity .45s ease, transform .55s cubic-bezier(.34, 1.56, .64, 1); }
/* صحنه‌ی سرمه‌ای پیش‌مشول — سکوی نرم زیر گربه تا رنگ نارنجی‌اش روی صفحه گم نشه */
      .pm-stage {
        position: absolute; z-index: 0; left: -14px; bottom: -6px; width: 120px; height: 120px;
        border-radius: 50%; pointer-events: none;
        background:
          radial-gradient(circle at 50% 30%, rgba(255, 196, 110, .30), rgba(255, 196, 110, 0) 58%),
          radial-gradient(circle at 50% 38%, #33497A 0%, #263863 46%, #1E2A44 78%);
        box-shadow:
          inset 0 0 0 2px rgba(214, 228, 255, .35),
          inset 0 -14px 26px rgba(8, 13, 26, .35),
          0 18px 34px rgba(23, 32, 54, .38),
          0 4px 10px rgba(23, 32, 54, .22);
      }
@media (max-width: 480px) { .pm-stage { width: 112px; height: 112px; left: -12px; bottom: -6px; } }
.pm-stage .spk { position: absolute; width: 13px; height: 13px; background: #FFC93D; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 4px rgba(255, 201, 61, .85)); animation: pmTwinkle 2.8s ease-in-out infinite alternate; }
.pm-stage .spk.s1 { top: 11%; right: 5%; }
.pm-stage .spk.s2 { bottom: 19%; left: 1%; width: 9px; height: 9px; background: #F6A8C9; filter: drop-shadow(0 0 4px rgba(242, 139, 180, .85)); animation-delay: 1.3s; }
@keyframes pmTwinkle { from { opacity: .35; transform: scale(.7) rotate(-10deg); } to { opacity: 1; transform: scale(1.08) rotate(12deg); } }
.pm-move { position: relative; z-index: 1; transition: transform .5s cubic-bezier(.34, 1.45, .64, 1); will-change: transform; }
.pm-move.dash-out { transform: translateX(-200%); transition: transform .38s cubic-bezier(.55, 0, .85, .4); }
.pm-cat { pointer-events: auto; position: relative; width: 92px; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.pm-cat:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 20px; }
@media (max-width: 480px) { .pm-cat { width: 88px; } }
.pm-bob { display: block; animation: pmBreathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
.pm-bob.stretch { animation: pmStretch .7s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pmBreathe { 0%, 100% { transform: translateY(0) rotate(0deg) scale(1, 1); } 50% { transform: translateY(-2px) rotate(.6deg) scale(1.012, 1.028); } }
@keyframes pmStretch { 0% { transform: scale(1, 1); } 35% { transform: scale(.93, 1.13) translateY(-3px); } 70% { transform: scale(1.04, .96); } 100% { transform: scale(1, 1); } }
.pm-cat.jump { animation: pmJump .6s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pmJump { 0% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-26px) scale(.95, 1.06); } 55% { transform: translateY(0) scale(1.09, .89); } 75% { transform: translateY(-9px) scale(.99, 1.01); } 100% { transform: translateY(0) scale(1, 1); } }
.pm-cat.celebrate { animation: pmCeleb .85s cubic-bezier(.34, 1.4, .64, 1); }
@keyframes pmCeleb { 0% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-34px) rotate(170deg); } 70% { transform: translateY(-6px) rotate(330deg); } 100% { transform: translateY(0) rotate(360deg); } }
.pm-cat.hop { animation: pmHop .5s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pmHop { 0% { transform: translateY(0); } 40% { transform: translateY(-14px); } 100% { transform: translateY(0); } }
.pm svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0 1.6px rgba(146, 72, 6, .5)) drop-shadow(0 3px 4px rgba(20, 28, 48, .16)); }
.pm.sleeping #pmHead { transform: rotate(-8deg) translateY(5px); }
.pm .pm-pj, .pm .pm-cap{ display:none; }
.pm.sleeping .pm-pj, .pm.sleeping .pm-cap{ display:block; }
.pm.tilting #pmHead { transform: rotate(7deg); }
.pm.nodding #pmHead { animation: pmNod .5s ease-in-out 2; }
@keyframes pmNod { 0%, 100% { transform: rotate(0) translateY(0); } 50% { transform: rotate(3deg) translateY(3px); } }
.pm-eye { transform-box: fill-box; transform-origin: center; transition: transform .09s ease; }
.pm-eye.closed, .pm.sleeping .pm-eye { transform: scaleY(.08); }
@keyframes pmTwitch { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-8deg); } 60% { transform: rotate(5deg); } }
@keyframes pmTail { from { transform: rotate(-7deg); } to { transform: rotate(11deg); } }
.pm-spark { opacity: 0; transform-box: fill-box; transform-origin: center; }
.pm.happy .pm-spark { animation: pmSparkle .75s ease-in-out infinite alternate; }
.pm.happy .pm-spark.d2 { animation-delay: .22s; }
.pm.happy .pm-spark.d3 { animation-delay: .44s; }
@keyframes pmSparkle { from { opacity: .15; transform: scale(.55) rotate(-8deg); } to { opacity: 1; transform: scale(1.1) rotate(14deg); } }
.pm.happy #pmTail { animation-duration: .55s; }
.pm.sleeping #pmTail { animation-duration: 4.5s; }
/* سلام پیش‌مشول — بدون دست: کج‌کردن شاد سر + پرش کوچولو + تکون گوش‌ها */
      .pm.waving #pmHead { animation: pmWaveTilt .42s ease-in-out infinite alternate; }
.pm.waving .pm-bob { animation: pmWaveBounce .42s ease-in-out infinite alternate; }
.pm.waving #pmEarL, .pm.waving #pmEarR { animation: pmTwitch .45s ease-in-out infinite; }
@keyframes pmWaveTilt { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(6deg) translateY(2px); } }
@keyframes pmWaveBounce { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-5px) scale(1.015, 1.03); } }
.pm-whiskers { filter: drop-shadow(0 1px 1px rgba(120, 72, 20, .35)); }
.pm-zzz { position: absolute; top: 0; right: 0; width: 30px; height: 44px; pointer-events: none; }
.pm-zzz span { position: absolute; bottom: 0; left: 8px; font-weight: 900; color: var(--accent); opacity: 0; line-height: 1; }
.pm-zzz span:nth-child(1) { font-size: .8rem; }
.pm-zzz span:nth-child(2) { font-size: 1.05rem; }
.pm-zzz span:nth-child(3) { font-size: 1.35rem; }
.pm.sleeping .pm-zzz span { animation: pmZ 2.7s ease-in infinite; }
.pm.sleeping .pm-zzz span:nth-child(2) { animation-delay: .9s; }
.pm.sleeping .pm-zzz span:nth-child(3) { animation-delay: 1.8s; }
@keyframes pmZ { 0% { opacity: 0; transform: translate(0, 4px) scale(.7) rotate(-6deg); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-16px, -36px) scale(1.15) rotate(8deg); } }
.pm-lines { position: absolute; top: 44%; right: -30px; width: 26px; pointer-events: none; }
.pm-lines span { display: block; height: 3px; border-radius: 3px; background: var(--ink-2); margin: 5px 0; opacity: 0; }
.pm.dashing .pm-lines span { animation: pmStreak .28s linear infinite; }
.pm-lines span:nth-child(2) { animation-delay: .09s; width: 70%; }
.pm-lines span:nth-child(3) { animation-delay: .18s; width: 85%; }
@keyframes pmStreak { 0% { opacity: 0; transform: translateX(-6px) scaleX(.5); } 40% { opacity: .7; } 100% { opacity: 0; transform: translateX(10px) scaleX(1.2); } }
.pm-fx { position: absolute; inset: 0; pointer-events: none; }
.pm-fx span { position: absolute; left: 46%; top: 26%; font-size: 1rem; line-height: 1; animation: pmBurst .95s cubic-bezier(.17, .67, .35, 1) forwards; }
@keyframes pmBurst { 0% { opacity: 1; transform: translate(0, 0) scale(.5) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.15) rotate(var(--rot)); } }
.pm-bubble { direction: rtl; pointer-events: none; position: relative; z-index: 2; max-width: 238px; background: var(--surface); color: var(--ink); border: 2px solid var(--accent); border-radius: 16px 16px 16px 5px; box-shadow: 0 14px 32px rgba(20, 28, 48, .28), 0 3px 8px rgba(20, 28, 48, .12); padding: 9px 12px 9px 30px; font-size: .87rem; font-weight: 600; line-height: 1.65; opacity: 0; transform: scale(.65) translateY(10px); transform-origin: 18px 100%; transition: opacity .3s ease, transform .38s cubic-bezier(.34, 1.5, .64, 1); }
.pm-bubble.show { opacity: 1; transform: none; pointer-events: auto; }
.pm-bubble p { margin: 0; }
.pm-bubble p span { opacity: 0; display: inline-block; transform: translateY(4px); transition: opacity .22s ease, transform .22s ease; }
.pm-bubble p span.on { opacity: 1; transform: none; }
.pm-bubble-close { position: absolute; top: 3px; inset-inline-end: 5px; width: 1.55rem; height: 1.55rem; min-height: 0; border: 0; background: none; color: var(--ink-2); font-size: .72rem; cursor: pointer; border-radius: 8px; padding: 0; }
@media (prefers-reduced-motion: reduce) { .pm, .pm * { animation: none !important; } .pm { opacity: 1; transform: none; } }
.reason .pm-voice { font-weight: 600; }
/* ---------- تقویم پیگیری شمسی + یادآوری‌ها ---------- */
      .strip .pm-line { margin: 0 0 6px; font-size: .9rem; color: var(--ink-2); }
@keyframes pmPurr { from { transform: translateX(-.8px) scale(1.004, 1.004); } to { transform: translateX(.8px) scale(1.01, 1.012); } }
.pm.purring .pm-bob { animation: pmPurr .16s ease-in-out infinite alternate; }
.pm.love-blink .pm-eye { transition: transform .5s ease; transform: scaleY(.08); }
.pm.yawning #pmHead { transform: rotate(-5deg) translateY(3px); }
.pm.yawning #pmEarL { transform: rotate(-16deg); }
.pm.yawning #pmEarR { transform: rotate(16deg); }
.pm.grooming #pmHead { transform: rotate(7deg) translateY(15px); }
.pm.bigtilt #pmHead { transform: rotate(15deg); }
.pm-cat.spin { animation: pmSpin .85s cubic-bezier(.34, 1.3, .64, 1); }
@keyframes pmSpin { 0% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-20px) rotate(160deg); } 70% { transform: translateY(-4px) rotate(320deg); } 100% { transform: translateY(0) rotate(360deg); } }
.sheet-close { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; width: 2.25rem; height: 2.25rem; font-size: 1rem; cursor: pointer; flex-shrink: 0; }
body.chat-open { overflow: hidden; }
.chat-view {
        position: fixed; inset: 0; z-index: 95; overflow-y: auto;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 42%),
          linear-gradient(160deg, #FFE9C4 0%, #FFD3A1 55%, #FFBE8A 100%);
        display: flex; align-items: flex-start; justify-content: center; padding: 18px 12px 26px;
      }
.chat-view[hidden] { display: none; }
.chat-card {
        background: var(--surface); color: var(--ink); width: 100%; max-width: 480px;
        border-radius: 26px; box-shadow: 0 24px 60px rgba(146, 72, 6, .28), 0 6px 18px rgba(146, 72, 6, .14);
        display: flex; flex-direction: column; overflow: hidden;
      }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.chat-ava { width: 46px; height: 46px; border-radius: 14px; object-fit: cover; flex-shrink: 0; }
.chat-title { display: flex; flex-direction: column; flex: 1; }
.chat-title b { font-size: 1.05rem; }
.chat-title span { font-size: .8rem; color: var(--ink-2); }
.chat-msgs { display: flex; flex-direction: column; gap: 10px; padding: 16px 14px; height: min(56vh, 520px); overflow-y: auto; background: var(--surface-2); }
.chat-row { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
.chat-row.cat { align-self: flex-start; }
.chat-row.me { align-self: flex-end; }
.chat-ava-sm { width: 30px; height: 30px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
.chat-bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 9px 13px; font-size: .95rem; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.chat-row.me .chat-bubble { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chat-row.typing .chat-bubble { color: var(--ink-2); animation: chatPulse 1.1s ease-in-out infinite; }
@keyframes chatPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.chat-form input { flex: 1; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: .95rem; background: var(--surface); color: var(--ink); }
.chat-form input:focus { border-color: var(--accent); outline: none; }
.chat-send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; font-weight: 800; padding: 10px 16px; cursor: pointer; font-size: .95rem; }
.chat-send:active { transform: scale(.96); }
/* ---- چیدمان صحنه‌ی خونه‌ی گربه ---- */
.pm{ position:relative !important; left:auto !important; bottom:auto !important; right:auto !important; transform:none !important; display:flex !important; flex-direction:column; align-items:center; z-index:1; pointer-events:none; }
.pm-cat{ width:min(64vw,252px) !important; touch-action:manipulation; }
.pm-bubble{ position:relative !important; left:auto !important; bottom:auto !important; transform:none !important; max-width:min(86vw,340px); margin:0 auto 10px; text-align:center; }
.pm-move{ display:flex; justify-content:center; }
body.chatting .pm-bubble{ display:none !important; }
.actions{ display:flex; gap:7px; padding:6px 10px 0; justify-content:center; margin-bottom:20mm; }
.actions button, .actions a.act{ font-family:inherit; font-size:14.5px; font-weight:700; border:0; border-radius:999px; padding:11px 15px; white-space:nowrap; cursor:pointer; color:#101a33; background:#ffc94d; box-shadow:0 6px 18px rgba(0,0,0,.35); touch-action:manipulation; text-decoration:none; display:inline-flex; align-items:center; }
.actions button.blue{ background:#5b8cff; color:#fff; }
.actions a.act.glass{ background:rgba(255,255,255,.08); color:#fff; border:1.5px solid rgba(255,255,255,.5); box-shadow:0 6px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.15); backdrop-filter:blur(4px); }
.actions button:active, .actions a.act:active{ transform:scale(.96); }
.hint{ color:#a5b0c6; font-size:13px; margin:0 0 8px; text-align:center; }
.fish-fly{ position:fixed; font-size:40px; z-index:96; pointer-events:none; opacity:0; }
/* گربه بالای پنجره‌ی گپ */
.chat-view{ z-index:95; }
.chat-card{ margin-top:52px; }
.chat-head{ padding-top:10px; }
#chatCatSlot{ width:84px; flex-shrink:0; display:flex; justify-content:center; }
#chatCatSlot .pm-move{ margin-top:-58px; }
#chatCatSlot .pm-cat{ width:84px !important; }
.chat-form input{ font-size:16px; }

.room-floor{ position:fixed; left:0; right:0; bottom:0; height:24%; background:linear-gradient(180deg,#101B31 0%,#0A1120 30%); border-top:2px solid rgba(216,178,92,.14); z-index:0; pointer-events:none; }
.room-rug-img{ position:fixed; left:50%; bottom:10.5%; transform:translateX(-50%) scaleY(.54); width:308px; height:308px; z-index:0; pointer-events:none; filter:drop-shadow(0 12px 16px rgba(0,0,0,.45)); }
.room-switch{ position:fixed; right:14px; top:47%; width:37px; height:62px; z-index:7; cursor:pointer; background:linear-gradient(180deg,#F5EFE0,#E7DCC3); border-radius:9px; box-shadow:0 4px 12px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.7); }
.room-switch::before, .room-switch::after{ content:''; position:absolute; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:#B07E2E; }
.room-switch::before{ top:4px; }
.room-switch::after{ bottom:4px; }
.switch-rocker{ position:absolute; left:6px; right:6px; top:13px; bottom:17px; border-radius:5px; background:linear-gradient(180deg,#FFFDF6,#EFE6CF); box-shadow:0 2px 5px rgba(0,0,0,.35), inset 0 -3px 5px rgba(120,90,30,.25); transition:all .25s ease; }
body.night .switch-rocker{ background:linear-gradient(0deg,#FFFDF6,#EFE6CF); box-shadow:0 -2px 5px rgba(0,0,0,.35), inset 0 3px 5px rgba(120,90,30,.28); }
.switch-dot{ position:absolute; left:50%; transform:translateX(-50%); bottom:6px; width:5px; height:5px; border-radius:50%; background:rgba(120,90,30,.35); transition:all .4s ease; }
body.night .switch-dot{ background:#FF9D3C; box-shadow:0 0 8px 2px rgba(255,157,60,.75); }
.room-clock{ position:relative; width:70px; height:70px; margin:7px auto 0; z-index:4; filter:drop-shadow(0 6px 14px rgba(0,0,0,.4)); pointer-events:none; }
.room-dim{ position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0; transition:opacity .7s ease; background:radial-gradient(ellipse 95% 75% at 50% 45%, rgba(3,6,16,.22) 0%, rgba(3,6,16,.55) 55%, rgba(2,4,12,.84) 100%); }
body.night .room-dim{ opacity:1; }
header, .stage, .hint, .actions{ position:relative; z-index:2; }
body.bare .room-floor, body.bare .room-rug-img, body.bare .wall-frame, body.bare .room-clock, body.bare .to-clock, body.bare .room-switch, body.bare .room-dim{ display:none !important; }
.to-clock{ text-align:center; font-size:15.5px; letter-spacing:3px; color:rgba(215,228,255,.62); margin-top:3px; font-variant-numeric:tabular-nums; }
#pmBubble{ max-height:34dvh; overflow-y:auto; scrollbar-width:none; }
#pmBubble::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div class="room-floor"></div><img class="room-rug-img" src="rug.png" alt=""><div class="room-switch" id="roomLamp" role="button" aria-label="کلید چراغ خواب"><div class="switch-rocker"></div><div class="switch-dot"></div></div><div class="room-dim"></div>
<div class="wall-frame" id="coupleFrame" role="button" aria-label="عکس پیش‌مشول و دوست‌دخترش"><img src="couple.webp" alt=""></div>
<header>
  <h1>پیش‌مشول</h1>
  <p>گربه‌ی هلیا — همیشه پیشته 🐾</p>
  <div class="to-clock" id="toClock">تورنتو --:--</div>
  <div class="room-clock" aria-hidden="true"><svg viewBox="0 0 100 100" width="70" height="70"><circle cx="50" cy="50" r="47" fill="#F7EFDD" stroke="#B07E2E" stroke-width="4"/><circle cx="50" cy="50" r="40" fill="none" stroke="#8A6D3B" stroke-width="6" stroke-dasharray="2 18.94" opacity=".65"/><line id="clkH" x1="50" y1="50" x2="50" y2="29" stroke="#20304F" stroke-width="5.5" stroke-linecap="round"/><line id="clkM" x1="50" y1="50" x2="50" y2="19" stroke="#20304F" stroke-width="3.5" stroke-linecap="round"/><line id="clkS" x1="50" y1="57" x2="50" y2="15" stroke="#C0392B" stroke-width="1.6" stroke-linecap="round"/><circle cx="50" cy="50" r="3.6" fill="#B07E2E"/></svg></div>
</header>
<div class="stage">
<div class="pm" id="pm">
      
      
      <div class="pm-bubble show" id="pmBubble" role="status">
        <button class="pm-bubble-close" id="pmBubbleClose" type="button" aria-label="بستن پیام پیش‌مشول">✕</button>
        <p id="pmText">سلام هلیا! من پیش‌مشولم 🐾</p>

<script>

// ---------- ابزار پایه ----------
function api(path, opts) {
  return fetch(path, opts || {}).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { return { http: r.status, ok: r.ok, j: j }; });
  });
}
function chatToday() {
  try {
    var parts = new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date());
    var y = '', m = '', d = '';
    parts.forEach(function (p) { if (p.type === 'year') y = p.value; if (p.type === 'month') m = p.value; if (p.type === 'day') d = p.value; });
    return y + '-' + m + '-' + d;
  } catch (e) { return ''; }
}
// قفل زوم: نه پینچ، نه دابل‌تپ
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

// ---------- پیش‌مشول زنده (همون موتور پنل) ----------
var pm = document.getElementById('pm');
var pmMove = document.getElementById('pmMove');
var pmCat = document.getElementById('pmCat');
var pmBob = document.getElementById('pmBob');
var pmBubble = document.getElementById('pmBubble');
var pmText = document.getElementById('pmText');
var pmFx = document.getElementById('pmFx');
var pmMouthOpen = document.getElementById('pmMouthOpen');
var pmMouthClosed = document.getElementById('pmMouthClosed');
var pmSleeping = false, pmWokeAt = 0, pmLastSayAt = 0;
var pmTalkTimer = null, pmTalkStop = null, pmHideTimer = null, pmIdleTimer = null;

function pmStopTalk() {
  if (pmTalkTimer) { clearInterval(pmTalkTimer); pmTalkTimer = null; }
  if (pmTalkStop) { clearTimeout(pmTalkStop); pmTalkStop = null; }
  if (pmMouthOpen) pmMouthOpen.setAttribute('opacity', '0');
  if (pmMouthClosed) pmMouthClosed.setAttribute('opacity', '1');
}
function pmFill(t) {
  var sl = window.__pmSlots || {};
  return String(t)
    .replace(/\{inst\}/g, sl.instrument || 'ساز')
    .replace(/\{drink\}/g, sl.drink || 'چایی')
    .replace(/\{wake\}/g, sl.wake || '')
    .replace(/\{city\}/g, sl.city || '');
}
var pmUnlockLines = [
          { k: 'instrument', t: 'هلیا، {inst}ت کوکه؟ یه کم بزن دلم باز شه 🎻' },
          { k: 'instrument', t: 'امروز {inst}تو زدی هلیا؟ 🎶' },
          { k: 'drink', t: 'بوی {drink} میاد هلیا… یا دلم برات تنگ شده؟ ☕' },
          { k: 'wake', t: 'هلیا امروزم ساعت {wake} بیدار شدی؟ آفرین به این نظم ⏰' },
          { k: 'city', t: 'هلیا، تو {city} هوا چطوره امروز؟ 🌦' }
        ];
function pmSay(text, hold) {
  text = pmFill(text);
  pmLastSayAt = Date.now();
  pmStopTalk();
  pmText.innerHTML = '';
  var words = text.split(' ');
  words.forEach(function (w, i) {
    var s = document.createElement('span');
    s.textContent = w;
    pmText.appendChild(s);
    if (i < words.length - 1) pmText.appendChild(document.createTextNode(' '));
    setTimeout(function () { s.classList.add('on'); if (pmBubble) pmBubble.scrollTop = pmBubble.scrollHeight; }, 60 + i * 70);
  });
  pmBubble.classList.add('show');
  var open = false;
  pmTalkTimer = setInterval(function () {
    open = !open;
    if (pmMouthOpen) pmMouthOpen.setAttribute('opacity', open ? '1' : '0');
    if (pmMouthClosed) pmMouthClosed.setAttribute('opacity', open ? '0' : '1');
  }, 150);
  pmTalkStop = setTimeout(pmStopTalk, Math.min(2600, Math.max(750, words.length * 230)));
  clearTimeout(pmHideTimer);
  var pmReadMs = Math.min(75000, Math.max(hold || 0, 4500 + text.length * 62));
  pmHideTimer = setTimeout(function () { pmBubble.classList.remove('show'); }, 60 + words.length * 70 + pmReadMs);
}
function pmBurst(chars, n) {
  var count = n || 8;
  for (var i = 0; i < count; i++) {
    var s = document.createElement('span');
    s.textContent = chars[i % chars.length];
    s.style.color = i % 2 ? '#F28BB4' : '#F5B921';
    s.style.setProperty('--dx', (Math.round(Math.random() * 150) - 75) + 'px');
    s.style.setProperty('--dy', (-(30 + Math.round(Math.random() * 70))) + 'px');
    s.style.setProperty('--rot', (Math.round(Math.random() * 160) - 80) + 'deg');
    pmFx.appendChild(s);
    (function (el) { setTimeout(function () { el.remove(); }, 1000); })(s);
  }
}
function pmJump(cls, ms) {
  pmCat.classList.remove(cls);
  void pmCat.offsetWidth;
  pmCat.classList.add(cls);
  setTimeout(function () { pmCat.classList.remove(cls); }, ms || 650);
}
function pmHappy(ms) {
  pm.classList.add('happy');
  setTimeout(function () { pm.classList.remove('happy'); }, ms || 1300);
}
(function pmBlinkLoop() {
  setTimeout(function () {
    if (!pmSleeping) {
      var eyes = document.querySelectorAll('.pm-eye');
      eyes.forEach(function (e) { e.classList.add('closed'); });
      setTimeout(function () { eyes.forEach(function (e) { e.classList.remove('closed'); }); }, 140);
    }
    pmBlinkLoop();
  }, 2600 + Math.random() * 1800);
})();
(function pmEarLoop() {
  setTimeout(function () {
    if (!pmSleeping) {
      var ear = document.getElementById(Math.random() < .5 ? 'pmEarL' : 'pmEarR');
      if (ear) { ear.classList.add('twitch'); setTimeout(function () { ear.classList.remove('twitch'); }, 480); }
    }
    pmEarLoop();
  }, 4200 + Math.random() * 3800);
})();
